<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VR Passthrough PoC</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="../../src/index.js"></script>
</head>
<body>
  <div id="start-screen">
    <h1>WebXR Passthrough</h1>
    <p>Please allow camera access to continue.</p>
    <button id="start-btn">Start XR Mode</button>
  </div>

  <div id="debug-panel" style="display: none;">
    <div class="slider-group">
      <label>barrel dist. (k1): <span id="k1-val">0.0</span></label>
      <input type="range" id="k1-slider" min="-0.5" max="0.5" step="0.01" value="0.0">
    </div>
    <div class="slider-group">
      <label>zoom level: <span id="zoom-val">1.0</span></label>
      <input type="range" id="zoom-slider" min="0.5" max="3.0" step="0.1" value="1.0">
    </div>
  </div>

  <a-scene xr-mode-ui="enabled: false"> <a-camera id="main-camera" xr-passthrough="k1: 0.0; zoom: 1.0;"></a-camera>
    
    <a-box position="0 1.5 -3" rotation="0 45 0" color="#4CC3D9"
           animation="property: rotation; to: 0 405 0; loop: true; dur: 3000"></a-box>
  </a-scene>
</body>
</html>
