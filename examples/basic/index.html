<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VR Passthrough PoC</title>
  <link rel="stylesheet" href="style.css">
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  
  <script type="module" src="../../src/index.js"></script>
</head>
<body>
  <div id="start-screen">
    <h1>WebXR Passthrough</h1>
    <p>Please allow camera access to continue.</p>
    <button id="start-btn">Start XR Mode</button>
  </div>

  <a-scene xr-mode-ui="enabled: false"> 
    <a-camera id="main-camera" xr-passthrough mxr-hand-tracking="maxHands: 1; delegate: GPU"></a-camera>
    
    <a-box position="0 1.5 -3" rotation="0 45 0" color="#4CC3D9"
           animation="property: rotation; to: 0 405 0; loop: true; dur: 3000"></a-box>
  </a-scene>

  <script>
    // é inicializada a lógica de interface do usuário
    document.addEventListener('DOMContentLoaded', () => {
      const startBtn = document.getElementById('start-btn');
      const startScreen = document.getElementById('start-screen');
      const cameraEl = document.getElementById('main-camera');

      // é disparado o componente da biblioteca com um clique
      startBtn.addEventListener('click', () => {
        // o desenvolvedor chama a api pública do addon
        cameraEl.components['xr-passthrough'].startCamera();
        
        // é ocultada a tela inicial
        startScreen.style.display = 'none';
      });
    });
  </script>
</body>
</html>
