<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>InteracXR Central Cursor</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script type="module" src="../../src/index.js"></script>
</head>
<body>
  <div id="start-screen">
    <h1>InteracXR</h1>
    <p>allow camera access</p>
    <button id="start-btn">start experience</button>
  </div>

  <a-scene xr-mode-ui="enabled:false" background="color:#111" renderer="colorManagement:true">
    <a-sky color="#87CEEB"></a-sky>
    
    <a-plane position="0 0 0" rotation="-90 0 0" width="50" height="50" color="#808080" material="roughness:1;metalness:0"></a-plane>
    <a-grid position="0 0.01 0"></a-grid>

    <a-box class="grabbable navmesh" position="0 1.5 -1.5" rotation="0 45 0" color="#4CC3D9" animation="property:rotation; to:0 405 0; loop:true; dur:3000"></a-box>

    <a-box id="test-button" class="interactable grabbable" position="1.2 1.5 -1.5" scale="0.4 0.4 0.1" color="#FF0055"></a-box>

    <a-entity id="camera-rig" position="0 1.6 0">
      <a-camera id="main-camera" position="0 0 0" 
        mxr-hand-tracking="maxHands:1" 
        mxr-gesture-detector="source:#main-camera"
        mxr-hand-model="source:#main-camera"
        mxr-cursor="targetClass: .grabbable, .interactable" 
        mxr-gaze-grabber="targetClass: .grabbable; activationPose: victory; grabPose: grab"
        mxr-interactor="targetClass: .interactable; interactPose: pinch"
        mxr-teleport="rig:#camera-rig; activationPose: rock; confirmPose: pinch; cancelPose: grab">
      </a-camera>
    </a-entity>
  </a-scene>

  <script>
    document.getElementById("start-btn").addEventListener("click", () => {
      const camera = document.getElementById("main-camera");
      camera.components["mxr-hand-tracking"].startTracking();
      document.getElementById("start-screen").style.display = "none";
    });

    // lógica padrão da web para escutar o clique no botão em xr
    document.getElementById("test-button").addEventListener("click", function() {
      const colors = ['#FF0055', '#00FF88', '#FFFF00', '#9900FF'];
      const randomColor = colors[Math.floor(Math.random() * colors.length)];
      this.setAttribute('color', randomColor);
    });
  </script>
</body>
</html>
